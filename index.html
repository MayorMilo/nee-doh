    const vx = X[c]-X[a], vy = X[c+1]-X[a+1], vz = X[c+2]-X[a+2];
    const nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
    NRM[a]+=nx; NRM[a+1]+=ny; NRM[a+2]+=nz; NRM[b]+=nx; NRM[b+1]+=ny; NRM[b+2]+=nz; NRM[c]+=nx; NRM[c+1]+=ny; NRM[c+2]+=nz;
  }
  for (let i = 0; i < 3*N; i += 3) { const l = Math.hypot(NRM[i], NRM[i+1], NRM[i+2]) || 1; NRM[i]/=l; NRM[i+1]/=l; NRM[i+2]/=l; }
  posAttr.needsUpdate = true; nrmAttr.needsUpdate = true;
  dohGeo.computeBoundingSphere();
}

// bubbles are embedded in the gel: affine fit of the body + local surface residual
const NB = 22, bubbles = [];
{
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  while (bubbles.length < NB) {
    const p = [rnd()*2-1, rnd()*2-1, rnd()*2-1], r = Math.hypot(...p);
    if (r > 0.82 || r < 0.15) continue;
    const dir = p.map(x => x / r), near = [];
    for (let i = 0; i < N; i++) {
      const d = Math.hypot(Q0[3*i]-dir[0], Q0[3*i+1]-dir[1], Q0[3*i+2]-dir[2]);
      if (near.length < 6 || d < near[5].d) { near.push({ i, d }); near.sort((a, b) => a.d - b.d); if (near.length > 6) near.pop(); }
    }
    const ws = near.map(n => 1 / (n.d + 0.04)), wsum = ws.reduce((a, b) => a + b);
    const size = 0.012 + rnd() ** 2.5 * 0.055;
    bubbles.push({ b0: p, f: r * r, near: near.map(n => n.i), w: ws.map(w => w / wsum), size, pos: new THREE.Vector3(...p) });
  }
}
const bubbleMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 18, 12),
  new THREE.MeshStandardMaterial({ color: '#ffffff', metalness: 1, roughness: 0.06, envMapIntensity: 1.6 }), NB);
bubbleMesh.frustumCulled = false;
scene.add(bubbleMesh);
const _bm = new THREE.Matrix4();
function updateBubbles(dt) {
  computeApq(Q0, _Apq); mul3(_Apq, Aqq0Inv, SM.A0);
  const A = SM.A0, cx = SM.cx, cy = SM.cy, cz = SM.cz;
  const det = Math.max(0.05, A[0]*(A[4]*A[8]-A[7]*A[5]) - A[3]*(A[1]*A[8]-A[7]*A[2]) + A[6]*(A[1]*A[5]-A[4]*A[2]));
  const sn = 1 / Math.cbrt(det), k = 1 - Math.exp(-dt * 9);
  for (let b = 0; b < NB; b++) {
    const B = bubbles[b], [x, y, z] = B.b0;
    let tx = cx + A[0]*x + A[3]*y + A[6]*z, ty = cy + A[1]*x + A[4]*y + A[7]*z, tz = cz + A[2]*x + A[5]*y + A[8]*z;
    let rx = 0, ry = 0, rz = 0;
    for (let n = 0; n < 6; n++) {
      const i = B.near[n], w = B.w[n], qx = Q0[3*i], qy = Q0[3*i+1], qz = Q0[3*i+2];
      rx += w * (X[3*i]   - (cx + A[0]*qx + A[3]*qy + A[6]*qz));
      ry += w * (X[3*i+1] - (cy + A[1]*qx + A[4]*qy + A[7]*qz));
      rz += w * (X[3*i+2] - (cz + A[2]*qx + A[5]*qy + A[8]*qz));
    }
    tx += rx * B.f; ty += ry * B.f; tz += rz * B.f;
    B.pos.x += (tx - B.pos.x) * k; B.pos.y += (ty - B.pos.y) * k; B.pos.z += (tz - B.pos.z) * k;
    const s = B.size, h = 0.5 * sn; // bubbles shear with the gel, but only halfway (surface tension)
    _bm.set(s*(0.5+h*A[0]), s*h*A[3], s*h*A[6], B.pos.x,
            s*h*A[1], s*(0.5+h*A[4]), s*h*A[7], B.pos.y,
            s*h*A[2], s*h*A[5], s*(0.5+h*A[8]), B.pos.z,
            0, 0, 0, 1);
    bubbleMesh.setMatrixAt(b, _bm);
  }
  bubbleMesh.instanceMatrix.needsUpdate = true;
}

// ============================================================================
// Input: lead hand follows the cursor, the other mirrors it through the centre
// ============================================================================
const input = { ndc: new THREE.Vector2(0, 0), right: true, down: false, twist: 0, inside: false };
const raycaster = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hit = new THREE.Vector3();
const canvas = renderer.domElement, leadEl = document.getElementById('lead');
function onMove(e) {
  input.ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  input.right = e.clientX >= innerWidth / 2;
  input.inside = true;
}
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerdown', e => { onMove(e); input.down = true; canvas.classList.add('squeezing'); canvas.setPointerCapture(e.pointerId); });
addEventListener('pointerup', () => { input.down = false; canvas.classList.remove('squeezing'); });
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') input.inside = false; });
canvas.addEventListener('wheel', e => { e.preventDefault(); input.twist = THREE.MathUtils.clamp(input.twist + e.deltaY * 0.004, -2.0, 2.0); }, { passive: false });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); placeCamera(); });

const pull = new THREE.Vector3(), pullSmooth = new THREE.Vector3();
let twistSmooth = 0;
function computePull(dt) {
  if (input.inside) {
    raycaster.setFromCamera(input.ndc, camera);
    if (raycaster.ray.intersectPlane(plane, hit)) {
      const m = Math.hypot(hit.x, hit.y) * P.pullGain;
      const mm = m > 1e-6 ? P.pullMax * Math.tanh(m / P.pullMax) / m * P.pullGain : 0;
      pull.set(hit.x * mm, hit.y * mm, 0);
      if (!input.right) pull.multiplyScalar(-1); // left half: left hand leads, so right hand gets the mirror
    }
  } else pull.multiplyScalar(Math.exp(-dt * 3));
  pullSmooth.lerp(pull, 1 - Math.exp(-dt * 18));
  input.twist *= Math.exp(-dt * 0.6);
  twistSmooth += (input.twist - twistSmooth) * (1 - Math.exp(-dt * 8));
  leadEl.textContent = (input.right ? 'Right' : 'Left') + ' hand leads';
}

let time = 0, lastPull = 0, pressPeak = 0;
const _a = new THREE.Vector3(), _target = new THREE.Vector3(), _acc = new THREE.Vector3(), XAX = new THREE.Vector3(1, 0, 0);
const _qa = new THREE.Quaternion(), _qt = new THREE.Quaternion();
function updateHands(dt) {
  const bob = Math.sin(time * 1.25) * 0.05;
  // hands are force-limited: they pull out briskly but ease back gently, letting the doh lead
  const om = releasing ? P.handReturn : P.handStiff, ze = releasing ? 1.0 : 0.6;
  for (const hd of hands) {
    hd.prevPos.copy(hd.pos); hd.prevRot.copy(hd.rot); hd.prevVel.copy(hd.vel);
    hd.force.copy(hd.forceAcc).divideScalar(P.substeps);
    hd.forceAcc.set(0, 0, 0);
    _target.copy(pullSmooth).multiplyScalar(hd.side); _target.y += bob;
    // the doh's tension (and weight) drags each hand back toward it
    const y = _a.copy(hd.force).multiplyScalar(P.handYield);
    if (y.length() > 0.9) y.setLength(0.9);
    _target.add(y);
    _acc.copy(_target).sub(hd.pos).multiplyScalar(om * om).addScaledVector(hd.vel, -2 * ze * om);
    hd.vel.addScaledVector(_acc, dt); hd.pos.addScaledVector(hd.vel, dt);
  }
  // both hands line up along the stretch axis; scroll twists them in opposition
  _a.set(2, 0, 0).add(hands[1].pos).sub(hands[0].pos).normalize();
  _qa.setFromUnitVectors(XAX, _a);
  for (const hd of hands) {
    _qt.setFromAxisAngle(_a, twistSmooth * hd.side * 1.2).multiply(_qa);
    hd.rot.slerp(_qt, 1 - Math.exp(-dt * 12));
  }
}

function updateHandMeshes(dt) {
  const dep = P.pressDepth * press, base = handGeo.base, mask = handGeo.mask, jig = handGeo.jig;
  for (const hd of hands) {
    // jelly lag: fingers trail the hand's acceleration
    _acc.copy(hd.vel).sub(hd.prevVel).divideScalar(Math.max(dt, 1e-4));
    const om = 17, ze = 0.32;
    hd.Jv.addScaledVector(_acc.multiplyScalar(-0.55).addScaledVector(hd.J, -om*om).addScaledVector(hd.Jv, -2*ze*om), dt);
    hd.J.addScaledVector(hd.Jv, dt);
    if (hd.J.length() > 0.25) hd.J.setLength(0.25);
    _a.copy(hd.J).applyQuaternion(_q.copy(hd.rot).invert());
    const jx = _a.x * -hd.side, jy = _a.y, jz = _a.z;
    const arr = hd.mesh.geometry.attributes.position.array;
    for (let v = 0; v < arr.length; v += 3) {
      const bx = base[v], by = base[v+1], bz = base[v+2], k = v / 3;
      const s = dep * mask[k] / (Math.hypot(bx, by, bz) || 1), j = jig[k];
      arr[v] = bx - bx*s + jx*j; arr[v+1] = by - by*s + jy*j; arr[v+2] = bz - bz*s + jz*j;
    }
    hd.mesh.geometry.attributes.position.needsUpdate = true;
    hd.mesh.position.copy(hd.pos); hd.mesh.quaternion.copy(hd.rot);
  }
}

// plastic creep: the remembered shape drifts toward what it's being held as, then recovers
function updateCreep(dt) {
  const R = SM.R, kc = 1 - Math.exp(-dt * P.creep), kr = 1 - Math.exp(-dt * P.recover);
  let mx = 0, my = 0, mz = 0;
  for (let i = 0; i < N; i++) {
    const px = X[3*i]-SM.cx, py = X[3*i+1]-SM.cy, pz = X[3*i+2]-SM.cz;
    const lx = R[0]*px + R[1]*py + R[2]*pz, ly = R[3]*px + R[4]*py + R[5]*pz, lz = R[6]*px + R[7]*py + R[8]*pz;
    let qx = Q[3*i] + (lx - Q[3*i]) * kc, qy = Q[3*i+1] + (ly - Q[3*i+1]) * kc, qz = Q[3*i+2] + (lz - Q[3*i+2]) * kc;
    qx += (Q0[3*i] - qx) * kr; qy += (Q0[3*i+1] - qy) * kr; qz += (Q0[3*i+2] - qz) * kr;
    Q[3*i] = qx; Q[3*i+1] = qy; Q[3*i+2] = qz; mx += qx; my += qy; mz += qz;
  }
  mx /= N; my /= N; mz /= N;
  for (let i = 0; i < N; i++) { Q[3*i] -= mx; Q[3*i+1] -= my; Q[3*i+2] -= mz; }
  computeAqqInv(Q, AqqInv);
}

function physicsStep(dt) {
  const S = P.substeps, h = dt / S, h2 = h * h;
  const g = P.gravity * h, visc = 1 - Math.exp(-P.viscosity * h), damp = Math.exp(-P.damping * h);
  const shapeK = 1 - Math.exp(-P.shapeRate * h);
  for (let s = 0; s < S; s++) {
    const t = (s + 1) / S;
    for (const hd of hands) hd.setSubstep(t);
    for (let i = 0; i < 3*N; i += 3) {
      Vel[i+1] += g;
      Xp[i] = X[i]; Xp[i+1] = X[i+1]; Xp[i+2] = X[i+2];
      X[i] += Vel[i]*h; X[i+1] += Vel[i+1]*h; X[i+2] += Vel[i+2]*h;
    }
    solveEdges(h2);
    solveBends(h2);
    shapeMatch(shapeK);
    solveFist(h);
    solveGrip(h2, s === S - 1);
    solveCollisions();
    solveEdges(h2); // second skin pass so the grip can't concentrate strain into a few edges
    solveVolume(h2);
    clampStrain();
    const inv = 1 / h;
    for (let i = 0; i < 3*N; i++) Vel[i] = (X[i] - Xp[i]) * inv * damp;
    applyViscosity(visc);
  }
}

// ============================================================================
// Loop
// ============================================================================
let last = performance.now(), paused = false, fpsAvg = 60;
function frame(now) {
  const dt = Math.min(Math.max((now - last) / 1000, 1 / 240), 1 / 30);
  last = now;
  if (!paused) tick(dt);
  renderer.render(scene, camera);
  fpsAvg += (1 / Math.max(dt, 1e-3) - fpsAvg) * 0.05;
  requestAnimationFrame(frame);
}
function tick(dt) {
  time += dt;
  computePull(dt);
  // people clench harder the further they pull, so pulling alone closes the fingers part-way
  const clench = Math.min(pullSmooth.length() / P.pullMax, 1) * P.pullClench;
  const pressTarget = Math.max(input.down ? 1 : 0, clench);
  press += (pressTarget - press) * (1 - Math.exp(-dt * (pressTarget > press ? 7 : 2.5)));
  // easing off (pull shrinking or squeeze letting go): grip loosens so the doh recovers on its own
  const pl = pullSmooth.length();
  releasing = pl < lastPull - 0.002 * 60 * dt || pressTarget < press - 0.02;
  lastPull = pl;
  pressPeak = Math.max(pressPeak, press);
  if (pressPeak > 0.3 && press < 0.04) { attachHand.fill(-1); pressPeak = 0; } // fingers re-seat on the relaxed skin
  fistHold += ((releasing ? 0.25 : 1) - fistHold) * (1 - Math.exp(-dt * (releasing ? 6 : 2)));
  displacePrims(P.pressDepth * press);
  updateHands(dt);
  physicsStep(dt);
  updateCreep(dt);
  updateFistMemory(dt);
  updateContacts(dt);
  updateNormals();
  updateBubbles(dt);
  updateHandMeshes(dt);
}
// settle the grip before the first frame
for (const hd of hands) { hd.setSubstep(1); }
updateContacts();
for (let i = 0; i < 30; i++) tick(1 / 60);
requestAnimationFrame(frame);

// ============================================================================
// UI: gel colours + hidden tuner (press T)
// ============================================================================
const sw = document.getElementById('swatches');
for (const [k, g] of Object.entries(GELS)) {
  const b = document.createElement('button');
  b.style.background = g.swatch; b.title = g.name + ' gel'; b.setAttribute('aria-label', g.name + ' gel');
  if (k === 'aqua') b.classList.add('on');
  b.onclick = () => {
    dohMat.attenuationColor.set(g.color); dohMat.attenuationDistance = g.dist;
    sw.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
  };
  sw.appendChild(b);
}
const tuner = document.getElementById('tuner');
for (const k of Object.keys(P)) {
  if (k === 'substeps') continue;
  const v0 = P[k], lab = document.createElement('label'), inp = document.createElement('input'), out = document.createElement('span');
  inp.type = 'range'; inp.min = 0; inp.max = 1000; inp.step = 1;
  const lo = v0 < 0 ? v0 * 3 : 0, hi = v0 < 0 ? 0 : (v0 === 0 ? 1e-4 : v0 * 3);
  inp.value = (v0 - lo) / (hi - lo) * 1000;
  out.textContent = (+v0).toPrecision(3);
  inp.oninput = () => { P[k] = lo + (hi - lo) * inp.value / 1000; out.textContent = P[k].toPrecision(3); };
  lab.append(k, inp, out); tuner.appendChild(lab);
}
addEventListener('keydown', e => { if (e.key === 't' || e.key === 'T') tuner.style.display = tuner.style.display === 'block' ? 'none' : 'block'; });

// debug / test hooks
window.__sim = {
  P, hands, input, X, N,
  get press() { return press; }, get fps() { return fpsAvg; },
  setCursor(fx, fy, down = false) { // fractions of the viewport, 0..1
    input.ndc.set(fx * 2 - 1, -(fy * 2 - 1)); input.right = fx >= 0.5; input.inside = true; input.down = down;
  },
  reset() {
    X.set(Q0); Q.set(Q0); Vel.fill(0); attachHand.fill(-1); computeAqqInv(Q, AqqInv); smQuat.identity();
    for (const hd of hands) { hd.pos.set(0, 0, 0); hd.vel.set(0, 0, 0); hd.rot.identity(); hd.prevPos.set(0, 0, 0); hd.prevRot.identity(); hd.force.set(0, 0, 0); hd.setSubstep(1); }
    resetFist(); releasing = false; fistHold = 1; lastPull = 0; pressPeak = 0;
    pull.set(0, 0, 0); pullSmooth.set(0, 0, 0); input.twist = 0; twistSmooth = 0; input.down = false; press = 0; displacePrims(0);
    updateContacts();
  },
  run(seconds) { const p = paused; paused = true; for (let t = 0; t < seconds; t += 1/60) tick(1/60); renderer.render(scene, camera); paused = p; },
  pause(v) { paused = v; },
  stats() {
    let mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9, attached = 0;
    for (let i = 0; i < N; i++) { mnx = Math.min(mnx, X[3*i]); mxx = Math.max(mxx, X[3*i]); mny = Math.min(mny, X[3*i+1]); mxy = Math.max(mxy, X[3*i+1]); if (attachHand[i] >= 0) attached++; }
    let maxStrain = 0;
    for (let e = 0; e < NE; e++) { const i = 3*EDGE[2*e], j = 3*EDGE[2*e+1]; maxStrain = Math.max(maxStrain, Math.hypot(X[j]-X[i], X[j+1]-X[i+1], X[j+2]-X[i+2]) / EREST[e] - 1); }
    return { width: +(mxx - mnx).toFixed(3), height: +(mxy - mny).toFixed(3), vol: +(meshVolume() / V0).toFixed(4), attached, maxStrain: +maxStrain.toFixed(3),
      handL: hands[0].pos.toArray().map(v => +v.toFixed(2)), handR: hands[1].pos.toArray().map(v => +v.toFixed(2)), fps: Math.round(fpsAvg) };
  },
};
</script>
